name: Gerar Setup EXE do HD Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'assets/**'
      - 'installer/**'
      - 'setup.iss'
      - '.github/workflows/gerar-setup-windows.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    name: Compilar Setup para Windows
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python no servidor de compilação
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Instalar ferramentas de compilação
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rodar testes da biblioteca e dos jogos
        shell: pwsh
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Criar aplicativo Windows sem Python externo
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name HDLauncher --icon "assets\hd-launcher.ico" --add-data "assets:assets" hd_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller falhou" }
          if (!(Test-Path 'dist\HDLauncher\HDLauncher.exe')) { throw "Executavel nao foi gerado" }
          if (!(Test-Path 'dist\HDLauncher\_internal\assets\hd-logo.png')) { throw "Logo nao incluida no pacote" }
          if (!(Get-ChildItem 'dist\HDLauncher' -Filter 'qwindows.dll' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) { throw "Plugin Qt para Windows nao incluido" }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $iscc = '${{ runner.temp }}\iscc-path.txt'
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")
          if (!($candidates | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel instalar Inno Setup" }
          }
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) { throw "ISCC.exe nao encontrado" }
          $compiler | Out-File -FilePath $iscc -Encoding utf8

      - name: Criar HDLauncher Setup.exe
        shell: pwsh
        run: |
          $compiler = Get-Content '${{ runner.temp }}\iscc-path.txt' -Raw
          & $compiler.Trim() setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilacao do Setup falhou" }
          if (!(Test-Path 'installer-output\HDLauncher-Setup-v1.6.0.exe')) { throw "Setup nao encontrado" }
          Get-Item 'installer-output\HDLauncher-Setup-v1.6.0.exe' | Select-Object Name, Length

      - name: Publicar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: HDLauncher-Setup-v1.6.0
          path: installer-output/HDLauncher-Setup-v1.6.0.exe
          if-no-files-found: error
          retention-days: 30
